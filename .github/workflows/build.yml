name: Build APK

on:
  push:
    branches: [ zombies-origins ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar que el APK es válido y está firmado
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -5
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk craterz.apk

      - name: Preparar el changelog
        id: changelog
        shell: bash
        run: |
          {
            echo "message<<CHANGELOG_EOF"
            git log -1 --pretty=%B | grep -vE '^(Co-Authored-By:|Claude-Session:)'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publicar como Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zombies-${{ github.run_number }}
          name: Cráter Z (build ${{ github.run_number }})
          body: |
            Descarga craterz.apk y ábrelo en el teléfono para instalar (APK de depuración).

            ${{ steps.changelog.outputs.message }}
          files: craterz.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
