name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar que el APK es válido y está firmado
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Usando build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -5
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | tail -5

      - name: Subir APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: navegador-tablet-sm-t110-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk navegador-tablet-sm-t110.apk

      - name: Preparar el changelog (mensaje del commit sin las líneas de atribución interna)
        id: changelog
        shell: bash
        run: |
          {
            echo "message<<CHANGELOG_EOF"
            git log -1 --pretty=%B | grep -vE '^(Co-Authored-By:|Claude-Session:)'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publicar como Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: Navegador Tablet v0.1.1
          body: |
            Descarga navegador-tablet-sm-t110.apk y ábrelo en el tablet para instalar (APK de
            depuración, generado automáticamente desde este cambio en main).

            ${{ steps.changelog.outputs.message }}
          files: navegador-tablet-sm-t110.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
