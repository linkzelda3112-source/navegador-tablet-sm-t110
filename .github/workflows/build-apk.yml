name: Construir APK de Sobrevive un año

on:
  push:
    branches: [ sobrevive-un-ano ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar la carpeta web
        run: |
          mkdir -p www/fonts
          cp index.html audio.mp3 www/
          cp -r js www/js
          curl -L --fail -o www/fonts/PressStart2P-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/pressstart2p/PressStart2P-Regular.ttf" || echo "Sin fuente pixel, se usa la de respaldo"

      - name: Crear el proyecto de Android
        run: |
          npx cap add android

      - name: Plugin nativo de guardado persistente (Block Store de Google)
        run: |
          PKG=android/app/src/main/java/com/sobreviveunano/game
          cp native/PersistentStorePlugin.java "$PKG/PersistentStorePlugin.java"
          cp native/MainActivity.java "$PKG/MainActivity.java"
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.google.android.gms:play-services-auth-blockstore:16.4.0"/' android/app/build.gradle
          grep -n "blockstore" android/app/build.gradle

      - name: Firma fija (permite actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          npx @capacitor/assets generate --android --iconBackgroundColor "#342c6e" --splashBackgroundColor "#28225c"
          npx cap sync android

      - name: Vertical y pantalla completa
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#</style>#    <item name="android:windowFullscreen">true</item>\n</style>#g' android/app/src/main/res/values/styles.xml

      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SobreviveUnAno.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SobreviveUnAno-APK
          path: SobreviveUnAno.apk

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sobrevive-${{ github.run_number }}
          name: Sobrevive un año APK ${{ github.run_number }}
          files: SobreviveUnAno.apk
