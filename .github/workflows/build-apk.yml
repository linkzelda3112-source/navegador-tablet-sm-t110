name: Build APK

on:
  push:
    branches: [ anime-striker, main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK (debug, ya firmado)
        run: gradle assembleDebug --no-daemon
      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk AnimeStriker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeStriker-apk
          path: AnimeStriker.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anime-striker-${{ github.run_number }}
          name: Anime Striker ${{ github.run_number }}
          files: AnimeStriker.apk
