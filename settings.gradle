pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Se deja por si en el futuro hace falta alguna librería que solo se publique en JitPack;
        // el visor de PDF actual (com.github.mhiew:android-pdf-viewer) ya está en Maven Central.
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "navegador-tablet-sm-t110"
include ':app'
