plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tabwii.pdfreader'
    compileSdk 35

    defaultConfig {
        applicationId "com.tabwii.pdfreader"
        // minSdk 17 = Android 4.2 "Jelly Bean" (la versión exacta que trae la Galaxy Tab 3 Lite
        // SM-T110). targetSdk se deja bajo también (19 = KitKat): como el sistema operativo real
        // del tablet es viejo y fijo, declarar un targetSdk moderno no le da nada nuevo a esta app
        // y sí puede activar comportamientos de compatibilidad pensados para Android actuales que
        // no tienen sentido aquí.
        minSdk 17
        targetSdk 19
        versionCode 3
        versionName "2.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Visor de PDF basado en PDFium (el mismo motor de Chrome). La librería original
    // (com.github.barteksc:android-pdf-viewer) ya no se puede descargar: sus versiones publicadas
    // dejaron de existir en los repositorios de Maven. Se usa en su lugar este fork mantenido
    // (mismo paquete de Java, com.github.barteksc.pdfviewer.*, así que el código no cambia), que
    // sigue publicado y disponible en Maven Central.
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'
}
