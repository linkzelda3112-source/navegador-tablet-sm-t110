plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tabwii.pdfreader'
    compileSdk 35

    defaultConfig {
        applicationId "com.tabwii.pdfreader"
        // minSdk 17 = Android 4.2 "Jelly Bean" (la versión exacta que trae la Galaxy Tab 3 Lite
        // SM-T110). targetSdk se deja bajo también (19 = KitKat): como el sistema operativo real
        // del tablet es viejo y fijo, declarar un targetSdk moderno no le da nada nuevo a esta app
        // y sí puede activar comportamientos de compatibilidad pensados para Android actuales que
        // no tienen sentido aquí.
        minSdk 17
        targetSdk 19
        versionCode 1
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Visor de PDF basado en PDFium (el mismo motor de Chrome), en su última versión que todavía
    // usa la librería de soporte vieja en vez de AndroidX — AndroidX dejó de admitir API 17 hace
    // años, así que esta es la única variante que de verdad corre en esta tablet.
    implementation 'com.github.barteksc:android-pdf-viewer:2.8.2'
}
