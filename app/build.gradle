plugins {
    id 'com.android.application'
}

android {
    namespace 'com.craterz'
    compileSdk 35

    defaultConfig {
        applicationId "com.craterz"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Sin librerías externas: render OpenGL ES 2.0, texturas y sonido se generan por código.
}
