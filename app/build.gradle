plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kiarena'
    compileSdk 35

    defaultConfig {
        applicationId "com.kiarena"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Sin librerías externas: todo el dibujo (Canvas) y el sonido (AudioTrack) están hechos a mano.
}
