<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sobrevive un año</title>
<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/PressStart2P-Regular.ttf) format('truetype');font-display:swap}
:root{--bg:#000;--fg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#box{position:relative;height:100%;aspect-ratio:360/640;max-width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style></head><body>
<div id="wrap"><div id="box"><canvas id="gl"></canvas><canvas id="ui"></canvas></div></div>
<script src="js/engine.js"></script><script src="js/worlds.js"></script><script src="js/game.js"></script>
</body></html>
